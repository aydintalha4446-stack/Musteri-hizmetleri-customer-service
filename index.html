<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Systems - AI Portfolio Core</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --green: #3fb950;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background: rgba(63, 185, 80, 0.15);
            color: var(--green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            background: #090d12;
            margin-bottom: 16px;
        }
        .msg {
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .bot-msg {
            color: var(--accent);
        }
        .user-msg {
            color: #ffa657;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: #090d12;
            border: 1px solid #30363d;
            color: var(--text);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Muhammed Talha Aydın <span class="status-badge">● AI Core Active</span></h2>
        <p style="color: #8b949e; margin: 0;">Siber Güvenlik Araştırmacısı & Sistem Geliştirici | Otonom Asistan</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg bot-msg">
            <strong>[MT AI Core]:</strong> Merhaba! Ben Talha'nın GitHub üzerindeki otonom asistanıyım. Projelerimiz, başarılarımız, yol haritamız ve güncellemelerimiz hakkında bana istediğin soruyu sorabilirsin!
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Bir soru sorun (Örn: Sırada hangi projeler var?)" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    // Bilgi Bankası (Verilerin burada saklanır ve yapay zeka buradan yanıt üretir)
    const knowledgeBase = {
        name: "Muhammed Talha Aydın",
        role: "Siber Güvenlik Araştırmacısı & Sistem Geliştirici",
        skills: "Python, Otonom Sistemler, Ağ Analizi, Django Debug Mode Denetimi, Linux/macOS Yönetimi",
        achievements: [
            "Django Debug Mode ve kritik konfigürasyon açıklarının tespiti ile bağımsız güvenlik raporlamaları.",
            "Yerel ağ ve otomasyon odaklı modüler Python sistemleri (mt_core, wa_bridge) geliştirilmesi.",
            "Kulvar Spor Kulübü Ankara A Takımı bünyesinde yüzme branşında Ankara dereceleri."
        ],
        current_projects: [
            "Agrobot: TÜBİTAK 2204-A için geliştirilen; raylı sistem, sensörler ve web paneline sahip otonom tarımsal izleme robotu.",
            "TalhaOS & BlackHole: Tehdit izolasyon protokolleri ve otonom çekirdek mimarileri."
        ],
        roadmap: [
            "Gelecek Hedef: ODTÜ Yazılım ve Havacılık Mühendisliği ÇAP (Çift Anadal) eğitimi ve doktora süreci.",
            "Sıradaki Proje: Gelişmiş çok katmanlı ağ izleme ve otomasyon tabanlı güvenlik analiz araçları."
        ],
        updates: "v2.1: GitHub AI Portfolyo çekirdeği yayınlandı ve canlı web erişimine açıldı."
    };

    function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const query = input.value.trim().toLowerCase();

        if (!query) return;

        // Kullanıcı Mesajını Ekle
        chatBox.innerHTML += `<div class="msg user-msg"><strong>[Ziyaretçi]:</strong> ${input.value}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // Akıllı Yanıt Üretme Mantığı
        setTimeout(() => {
            let reply = "Bu konuda detaylı bilgi veritabanında bulunmuyor, ancak Talha ile doğrudan iletişime geçebilirsiniz.";

            if (query.includes("başarı") || query.includes("derece") || query.includes("ödül")) {
                reply = "<strong>Başarılar & Çalışmalar:</strong><br>• " + knowledgeBase.achievements.join("<br>• ");
            } else if (query.includes("proje") || query.includes("agrobot") || query.includes("talhaos")) {
                reply = "<strong>Aktif Projeler:</strong><br>• " + knowledgeBase.current_projects.join("<br>• ");
            } else if (query.includes("sonraki") || query.includes("hedef") || query.includes("yol haritası") || query.includes("gelecek")) {
                reply = "<strong>Gelecek Yol Haritası & Hedefler:</strong><br>• " + knowledgeBase.roadmap.join("<br>• ");
            } else if (query.includes("güncelleme") || query.includes("sürüm") || query.includes("yeni")) {
                reply = "<strong>Sistem Güncellemesi:</strong> " + knowledgeBase.updates;
            } else if (query.includes("yetenek") || query.includes("beceri") || query.includes("dil")) {
                reply = "<strong>Teknik Yetenekler:</strong> " + knowledgeBase.skills;
            } else if (query.includes("merhaba") || query.includes("selam")) {
                reply = "Merhaba! Size Talha'nın projeleri veya gelecek planları hakkında nasıl yardımcı olabilirim?";
            }

            chatBox.innerHTML += `<div class="msg bot-msg"><strong>[MT AI Core]:</strong> ${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 400);
    }
</script>

</body>
</html>
